<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123f46"><title>ECG 遊戲化介面｜三種方案試玩</title><style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#183a42;background:#f3f5f3;--accent:#067568;--soft:#e3f4ed;--dark:#123f46}*{box-sizing:border-box}body{margin:0;padding:24px 18px 50px}button{font:inherit;cursor:pointer;min-height:48px;border:0;border-radius:14px;padding:12px 18px;font-weight:750;background:var(--soft);color:var(--dark)}button:focus-visible,a:focus-visible{outline:3px solid #eb9b29;outline-offset:3px}button:disabled{opacity:.55;cursor:default}a{color:var(--accent)}.wrap{max-width:1120px;margin:auto}.eyebrow{font-size:12px;letter-spacing:2px;font-weight:800;color:var(--accent)}h1{font-size:clamp(25px,5vw,38px);margin:12px 0}p{line-height:1.7}.lead{max-width:720px;color:#607176}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:24px 0}.tab{text-align:left;background:white;border:2px solid transparent;box-shadow:0 3px 18px #123f4607}.tab[aria-selected=true]{border-color:var(--accent);background:var(--soft)}.tab b{display:block;font-size:17px}.tab span{display:block;font-size:13px;font-weight:500;margin-top:7px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:25px;align-items:start}.stage{border-radius:28px;overflow:hidden;background:#f9fbfa;border:1px solid #dbe6df;box-shadow:0 18px 55px #143f4612;min-width:0}.topbar{display:flex;align-items:center;justify-content:space-between;background:white;padding:18px 22px;gap:10px}.brand{font-size:13px;letter-spacing:1px}.level{font-size:13px;padding:8px 11px;border-radius:25px;background:var(--soft);font-weight:750}.screen{padding:22px;min-height:540px}.banner{border-radius:20px;background:var(--dark);color:white;padding:24px;position:relative;overflow:hidden}.banner:after{content:"✦";position:absolute;right:20px;top:-7px;font-size:105px;color:#ffffff14}.banner h2{font-size:26px;margin:8px 0}.banner p{margin:7px 0;color:#d9e9e5;font-size:14px;position:relative;z-index:1}.label{font-size:12px;letter-spacing:1px;font-weight:750}.stats{display:flex;gap:10px;margin-top:16px}.stats span{background:#ffffff18;padding:8px 12px;border-radius:10px;font-size:13px}.primary{background:var(--accent);color:white}.white{background:white;color:var(--dark)}.zone{display:flex;background:#e8eeea;padding:4px;border-radius:13px;gap:5px;margin:18px 0}.zone button{flex:1;padding:10px 6px;min-height:44px;font-size:14px;background:transparent}.zone button.active{background:white;box-shadow:0 2px 5px #0001}.path{position:relative;padding:0 8px}.node{display:flex;gap:16px;align-items:center;position:relative;padding-bottom:20px}.node:not(:last-child):after{content:"";position:absolute;top:52px;bottom:0;left:25px;width:3px;background:#d0e6db}.circle{width:52px;height:52px;border-radius:18px;flex-shrink:0;background:var(--soft);display:grid;place-items:center;font-size:22px;border:2px solid #cde3d6}.node.current .circle{background:var(--accent);color:white;border-color:var(--accent);box-shadow:0 0 0 5px var(--soft)}.node.current{background:white;border-radius:17px;padding:15px 10px 20px;margin-left:-10px}.node.current:after{left:35px}.node button{margin-left:auto;padding:10px 14px;font-size:13px}.node b{font-size:15px}.node small{display:block;color:#647b7c;margin-top:5px}.bottom{display:flex;justify-content:space-around;background:white;border-top:1px solid #e1e8e4;padding:12px;font-size:13px;color:#6c7f7f}.bottom b{color:var(--accent)}.side{background:white;border-radius:22px;padding:24px}.side h2{font-size:21px;margin:0 0 12px}.side p{font-size:14px;color:#607176}.side ul{padding-left:20px;font-size:14px;line-height:1.9}.side .choose{display:block;text-align:center;padding:14px;border-radius:12px;background:var(--soft);font-weight:750;color:var(--accent);margin-top:20px}.card{border-radius:17px;background:white;border:1px solid #e1e8e4;padding:18px;margin:14px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.track{background:#e4ece7;height:9px;border-radius:8px;overflow:hidden;margin-top:12px}.track i{display:block;width:55%;height:100%;background:var(--accent)}.avatar{width:90px;height:90px;background:#e6f5ed;border:6px solid white;border-radius:50%;display:grid;place-items:center;font-size:42px;box-shadow:0 5px 20px #0001}.profile{display:flex;gap:20px;align-items:center}.profile h2{font-size:22px}.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.badge{text-align:center;border-radius:15px;background:var(--soft);padding:15px 6px;font-size:12px;font-weight:700}.badge span{display:block;font-size:30px;margin-bottom:7px}.locked{background:#f0f2f2;color:#869696}.case{border-top:4px solid var(--accent)}.case h3{font-size:17px;margin:8px 0}.case small{color:#71817f}.case p{font-size:14px;color:#607176}.full{width:100%}.ecg{background:#fff;border:1px solid #e4c9cc;border-radius:12px;overflow:hidden;margin:18px 0}.ecg img{width:100%;height:auto;display:block}.steps{display:flex;flex-wrap:wrap;gap:7px;margin:15px 0}.steps span{font-size:12px;border-radius:8px;padding:6px 8px;background:var(--soft)}.reward{text-align:center;padding:18px 4px}.reward .icon{font-size:70px}.reward h2{font-size:27px}.reward p{color:#627572}.reward .points{font-size:36px;font-weight:850;color:var(--accent)}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions button{flex:1}.demo{border-radius:12px;background:#fff2d2;color:#6c511b;padding:10px 14px;font-size:13px;margin:16px 0}.note{margin-top:22px;font-size:13px;color:#627572}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#153d44;color:white;padding:13px 20px;border-radius:14px;max-width:90%;z-index:5;font-size:14px}.toast[hidden]{display:none}@media(max-width:800px){.layout{grid-template-columns:1fr}.side{order:2}.stage{max-width:620px;width:100%;margin:auto}.screen{min-height:0}.tabs{gap:6px}.tab{padding:12px 8px}.tab b{font-size:14px}.tab span{font-size:12px}.side{padding:20px}body{padding:18px 12px 40px}.banner{padding:20px}.screen{padding:16px}.node button{padding:9px}.topbar{padding:16px}.brand{font-size:11px}}@media(prefers-reduced-motion:no-preference){.reward .icon{animation:pop .4s ease-out}@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}}
</style></head><body><main class="wrap"><div class="eyebrow">ECG RHYTHM CHALLENGE · DESIGN LAB</div><h1>讓練習，變成一段看得見的冒險。</h1><p class="lead">三種可實作的遊戲化介面。點選方案並試玩任務，看看哪一種最適合您的學生。這是獨立介面預覽，正式網站維持原版。</p><div class="tabs" role="tablist" aria-label="介面方案"><button class="tab" data-tab="A" role="tab" aria-selected="true"><b>A　闖關地圖 ★ 推薦</b><span>一路解鎖，知道下一步</span></button><button class="tab" data-tab="B" role="tab" aria-selected="false"><b>B　成長與徽章</b><span>收藏成就，看見自己的進步</span></button><button class="tab" data-tab="C" role="tab" aria-selected="false"><b>C　臨床任務</b><span>扮演護理學生，完成情境任務</span></button></div><div class="layout"><section class="stage" aria-label="可操作的介面預覽"><div class="topbar"><b class="brand">ECG QUEST / 心律冒險</b><span class="level" id="level">Lv. 03 · 240 XP</span></div><div class="screen" id="screen"></div><div class="bottom"><b>⌂ 任務</b><span>◇ 成就</span><span>▤ 我的紀錄</span></div></section><aside class="side" id="description"></aside></div><p class="note">預覽中的等級、分數與完成紀錄為示範資料；「完成示範」只展示獎勵流程，不代表臨床答題正確。正式版會接回現有題庫、中文解析與錯題重練。所有方案都保留自由練習，無須登入，也不設強制倒數。</p><p class="note"><a href="../">返回目前正式網站 →</a></p></main><div id="toast" class="toast" role="status" hidden></div><script>
const descriptions={A:{title:'A｜闖關地圖',tag:'最推薦：適合課堂與自主練習',text:'把原本分散的練習，變成有起點、有終點的學習旅程。',items:['判讀與治療各有一張任務地圖。','每關 5 題；通關獲得星星與 XP。','未熟悉的題目收進「再挑戰」，補練後提升星等。','未解鎖關卡可預覽，自由練習始終開放。'],result:'最有「下一關再玩一下」的感覺。'},B:{title:'B｜成長與徽章',tag:'適合持續練習與個人進步',text:'用角色等級、熟悉度與收藏徽章，讓學生看見每次練習的累積。',items:['兩區都能累積個人 XP 與成就。','14 種心律各自顯示練習與掌握進度。','完成指定學習目標解鎖徽章。','推薦任務優先帶回較不熟悉的心律。'],result:'可自由選題，成長感最強。'},C:{title:'C｜臨床任務',tag:'適合教師帶課與判讀到處置的連結',text:'每次走進一個模擬情境，完成「辨認心律 → 判斷處置」任務。',items:['同一任務分成判讀與治療兩站。','完成一站即可保留進度，手機可分段練。','答錯先給提示與中文解析，再回到任務。','完成後獲得任務章與個人學習回顧。'],result:'情境代入感最好，內容整合最多。'}};
let mode='A',zone='rhythm',completed={A:false,B:false,C:false};const screen=document.getElementById('screen');const names=['竇性心律','心房心律','心室心律','房室傳導阻滯'];
function zoneTabs(){return `<div class="zone"><button data-zone="rhythm" class="${zone==='rhythm'?'active':''}">① 心律名稱判讀</button><button data-zone="treatment" class="${zone==='treatment'?'active':''}">② 治療方式</button></div>`}
function home(){let d=descriptions[mode];document.documentElement.style.setProperty('--accent',mode==='B'?'#7560bd':mode==='C'?'#1476a1':'#067568');document.documentElement.style.setProperty('--soft',mode==='B'?'#f0ecfa':mode==='C'?'#e4f1fa':'#e3f4ed');document.getElementById('level').textContent=completed[mode]?'Lv. 03 · 290 XP':'Lv. 03 · 240 XP';document.getElementById('description').innerHTML=`<div class="eyebrow">${d.tag}</div><h2 style="margin-top:12px">${d.title}</h2><p>${d.text}</p><ul>${d.items.map(x=>'<li>'+x+'</li>').join('')}</ul><p><b>${d.result}</b></p><div class="choose">喜歡這個方案？回覆「${mode}」即可</div><button class="full" data-reset style="margin-top:12px">重設此方案示範</button>`;
if(mode==='A')screen.innerHTML=`<div class="banner"><div class="label">YOUR LEARNING JOURNEY</div><h2>今天，解鎖下一站。</h2><p>每次 5 題，讓判讀一步步變熟悉。</p><div class="stats"><span>★ ${completed.A?'6':'4'} 顆星</span><span>◆ 2 / 4 站已探索</span></div></div>${zoneTabs()}<div class="path">${names.map((n,i)=>`<div class="node ${i===1?'current':''}"><div class="circle">${i===0?'✓':i===1?'⚡':i===2?'◇':'♜'}</div><div><b>${String(i+1).padStart(2,'0')} · ${n}</b><small>${i===0?'已完成 ★★★':i===1?(completed.A?'新獲得 ★★☆':'目前任務 · 5 題'):'下一站 · 可查看'}</small></div><button data-start="${n}" class="${i===1?'primary':''}">${i===1?'挑戰':'查看'}</button></div>`).join('')}</div><button data-free class="full">自由練習 · 隨時開始</button>`;
if(mode==='B')screen.innerHTML=`<div class="banner"><div class="profile"><div class="avatar">🌱</div><div><div class="label">MY ECG JOURNEY</div><h2>心律探索者</h2><p>Lv. 3 · 每一次練習都在成長</p></div></div><div class="track"><i style="width:${completed.B?'73':'55'}%"></i></div><p>${completed.B?'再 110':'再 160'} XP 升至 Lv. 4</p></div>${zoneTabs()}<div class="card"><div class="row"><b>今日成長任務</b><span>＋50 XP</span></div><p>用六個步驟觀察心律，完成 5 題練習。</p><button data-start="今日成長任務" class="primary full">${completed.B?'再練一組':'開始累積經驗'}</button></div><div class="row"><h3>我的徽章收藏</h3><small>示範</small></div><div class="badges"><div class="badge"><span>🔎</span>初次探索</div><div class="badge ${completed.B?'':'locked'}"><span>🌟</span>五題小達人</div><div class="badge locked"><span>🏅</span>心律全探索</div></div><div class="card"><div class="row"><b>心房心律熟悉度</b><small>示範資料</small></div><div class="track"><i style="width:${completed.B?'75':'45'}%"></i></div></div><button data-free class="full">自由練習 · 選擇想學的心律</button>`;
if(mode==='C')screen.innerHTML=`<div class="banner"><div class="label">CLINICAL MISSION</div><h2>輪到你，接下這次任務。</h2><p>先辨認心律，再完成治療方式練習。</p><div class="stats"><span>▣ 2 站任務</span><span>✦ 任務完成章</span></div></div>${zoneTabs()}<div class="card case"><small>MISSION 01 / 心律觀察任務</small><h3>從心電圖找到關鍵線索</h3><p>觀察六項特徵，判斷心律名稱。接著進入對應的治療情境題。</p><div class="steps"><span>① 判讀站</span><span>② 治療站</span></div><button data-start="心律觀察任務" class="primary full">${completed.C?'重新接受任務':'接受任務'}</button></div><div class="card row"><div><b>任務回顧</b><p style="margin-bottom:0">${completed.C?'已取得一枚任務章':'完成後查看判讀與治療的學習重點'}</p></div><span style="font-size:36px">${completed.C?'🎖':'📋'}</span></div><button data-free class="full">單區自由練習</button>`;}
function task(title){screen.innerHTML=`<div class="row"><button data-home>← 返回</button><span class="level">${mode==='C'?'第 1 站 / 2 站':'示範任務 / 5 題'}</span></div><div class="demo">這頁示範任務介面與獎勵流程；正式題目將使用現有題庫。</div><h2>${title}</h2><p>${zone==='rhythm'?'觀察心電圖，再按照六項特徵判讀。':'閱讀病況情境，再選擇合適的處置。'}</p>${zone==='rhythm'?'<div class="ecg"><img src="../assets/ecg-approved/nsr.png" alt="已確認的心電圖示範，無題目答案標示"></div><div class="steps">'+['速率','規則','P 波','QRS','PR','P 波與 QRS 關係'].map(x=>'<span>'+x+'</span>').join('')+'</div>':'<div class="card"><b>正式版將顯示完整病況情境</b><p>包含脈搏、症狀與血流動力學狀況，沿用已核實的治療題目。</p></div>'}<div class="card"><b>學習獎勵</b><p>完成練習獲得 XP；答錯可看解析、加入再挑戰。進度由實際作答累積。</p></div><button data-complete class="primary full">完成示範 → 看獎勵畫面</button>`;}
function reward(){completed[mode]=true;screen.innerHTML=`<div class="reward"><div class="icon">${mode==='A'?'⭐':mode==='B'?'🌟':'🎖'}</div><div class="eyebrow">MISSION COMPLETE · 示範</div><h2>${mode==='A'?'你又往前了一站！':mode==='B'?'新徽章，加入收藏！':'任務完成，收下你的任務章。'}</h2><div class="points">＋50 XP</div><p>${mode==='A'?'獲得 ★★☆；補練後可繼續提升星等。':mode==='B'?'解鎖「五題小達人」，看見自己的累積。':'將判讀與治療串成完整學習旅程。'}</p><div class="card"><b>下一步：回顧不熟悉的題目</b><p>正式版會根據實際答題紀錄推薦補練，並保留中文重點解析。</p></div><div class="actions"><button data-home class="primary">回到任務首頁</button><button data-retry>體驗再挑戰</button></div></div>`;document.getElementById('level').textContent='Lv. 03 · 290 XP';}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab){mode=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.setAttribute('aria-selected',String(x===b)));home()}else if(b.dataset.zone){zone=b.dataset.zone;home()}else if(b.hasAttribute('data-start'))task(b.dataset.start);else if(b.hasAttribute('data-complete'))reward();else if(b.hasAttribute('data-home'))home();else if(b.hasAttribute('data-reset')){completed[mode]=false;home()}else if(b.hasAttribute('data-free'))task('自由練習');else if(b.hasAttribute('data-retry'))task('再挑戰 · 回顧與練習')});home();
</script></body></html>
