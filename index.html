</style></head><body><main class="app"><header class="top"><div class="brand"><div class="pulse">⌁</div><div><h1>ECG Rhythm Challenge</h1><p>看 ECG → 找特徵 → 判斷心律</p></div></div><div id="scoreBadge" class="score">Practice · Unlimited</div></header><nav class="modebar" aria-label="Study mode"><button id="practiceBtn" class="active">Practice Mode</button><button id="quizBtn">Quiz Mode</button><button id="resetBtn">Home</button><select id="level" class="level" aria-label="Difficulty"><option value="beginner">Beginner</option><option value="intermediate" selected>Intermediate</option><option value="advanced">Advanced</option></select></nav><section class="board" id="app"></section></main><script>

 {id:'NSR',name:'NSR',full:'Normal Sinus Rhythm',zh:'正常竇性心律',find:['HR：60–100 bpm','PP / RR interval：regular','P wave：每個 QRS 前都有正常 P wave','PR interval：固定且正常']},

 {id:'AF',name:'AF',full:'Atrial Fibrillation',zh:'心房顫動',find:['P wave：無可辨識的正常 P wave','RR interval：irregular','Ventricular rhythm：irregularly irregular','Baseline：細小 fibrillatory activity']},
 {id:'PVC',name:'PVC / VPC',full:'Premature Ventricular Contraction',zh:'心室早期收縮',find:['Beat appears prematurely','Wide and bizarre QRS','前方通常沒有正常 P wave','之後常見完全代償性停頓']},
 {id:'VT',name:'VT',full:'Ventricular Tachycardia',zh:'心室心搏過速',find:['HR：快速，常 > 100 bpm','Rhythm：regular 或近乎規則','QRS：wide and bizarre','多個連續 ventricular beats']},
 {id:'VF',name:'VF',full:'Ventricular Fibrillation',zh:'心室顫動',find:['無可辨識的 P-QRS-T complex','Baseline：chaotic, irregular waveform','無組織化的 ventricular activity']},
 {id:'AV1',name:'1° AV Block',full:'First-degree AV Block',zh:'第一度房室傳導阻滯',find:['每一個 P wave 後都有 QRS','PR interval：延長','PR interval：固定','RR interval：通常規則']},

function getFindings(id){

function settings(id){let bpm=75;if(id==='SB')bpm=pick([42,48,54,58]);if(id==='ST')bpm=pick([108,120,132,145]);if(id==='SVT')bpm=pick([160,180,200,220]);if(id==='VT')bpm=pick([120,145,170,190]);if(id==='AFL')bpm=pick([75,100,150]);if(id==='AF')bpm=pick([72,88,104,118]);if(id==='AV3')bpm=pick([34,38,44]);if(id==='NSR')bpm=pick([66,72,81,88]);return{bpm,pacAt:pick([2,3,4]),pvcAt:pick([2,3,4]),seed:Math.random()*100};}
function generate(id){let opts=[id,...groups[id]];if(level==='beginner'){opts=[id,...groups[id].slice(0,2),pick(allowedRhythms.filter(x=>!opts.includes(x.id))).id]} return {r:rhythm(id),options:shuffle(opts),s:settings(id)};}
function newQuestion(forced){cancelAnimationFrame(raf);question=generate(forced||pick(allowedRhythms).id);answered=false;renderQuestion();}
function renderQuestion(){const q=question;$('#scoreBadge').textContent=mode==='quiz'?`Question ${qIndex+1} / ${quiz.length}`:`Practice · ${level[0].toUpperCase()+level.slice(1)}`;app.innerHTML=`<div class="meta"><span>${mode==='quiz'?'Quiz Mode':'Practice Mode'}</span><span>Observe the full strip</span></div><div class="ecg-wrap"><canvas id="ecg" aria-label="Animated ECG rhythm strip"></canvas></div><div class="question">What is this rhythm?</div><div class="answers">${q.options.map((id,i)=>`<button class="option" data-id="${id}"><span>${'ABCD'[i]}. </span>${rhythm(id).name}</button>`).join('')}</div><div id="feedback"></div>`;document.querySelectorAll('.option').forEach(b=>b.onclick=()=>answer(b.dataset.id));drawECG(q.r.id,q.s);}

function home(which){cancelAnimationFrame(raf);mode=which;$('#scoreBadge').textContent='Ready to learn';app.innerHTML=which==='quiz'?`<div class="home"><h2>Quiz Mode</h2><p>完成後才會看到答案與錯題分析。所有題目只從教師指定的 13 種心律產生。</p><div class="quizsetup"><button class="start" data-n="10">10 Questions</button><button class="start" data-n="20">20 Questions</button><button class="start" data-n="30">30 Questions</button></div></div>`:`<div class="home"><h2>Can you identify the rhythm?</h2><p>以短題、大量曝光建立 ECG pattern recognition。先看心率、規律性、P wave、QRS 與 PR interval，再作答。</p><button class="start" id="goPractice">Practice</button><button class="start alt" id="goQuiz">Quiz</button><p class="tiny">固定範圍：13 種教師指定心律 · 不自動新增其他心律</p></div>`;if(which==='quiz')document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>startQuiz(+b.dataset.n));else{$('#goPractice').onclick=()=>{mode='practice';newQuestion()};$('#goQuiz').onclick=()=>home('quiz')}}
function startQuiz(n){mode='quiz';qIndex=0;results=[];quiz=Array.from({length:n},()=>generate(pick(allowedRhythms).id));question=quiz[0];renderQuestion();}

function drawECG(id,s){const c=$('#ecg'),ctx=c.getContext('2d');const dpr=devicePixelRatio||1;function resize(){c.width=c.clientWidth*dpr;c.height=c.clientHeight*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}resize();let offset=0;const W=()=>c.clientWidth,H=()=>c.clientHeight,base=()=>H()/2;function gauss(x,mu,amp,w){return amp*Math.exp(-(((x-mu)/w)**2))}function beat(t,center,wide=false,p=true,pr=.16){let y=0;if(p)y+=gauss(t,center-pr,.13,.026);y+=gauss(t,center-.025,-.16,.012)+gauss(t,center,.92,wide?.040:.016)+gauss(t,center+.035,-.27,.016)+gauss(t,center+.27,.25,.055);return y}function val(t){let rr=60/s.bpm;if(id==='VF')return .25*Math.sin(2*Math.PI*t*5+s.seed)+.16*Math.sin(2*Math.PI*t*8.2)+.12*Math.sin(2*Math.PI*t*13.7);if(id==='AF'){let centers=[],z=-1;while(z<9){z+=rr*(.72+((Math.sin(z*8+s.seed)+1)/2)*.55);centers.push(z)}return centers.reduce((a,x)=>a+beat(t,x,false,false),.028*Math.sin(t*36)+.02*Math.sin(t*57));}if(id==='AFL'){let y=.07*Math.sin(2*Math.PI*t*5.1);for(let z=-1;z<9;z+=rr)y+=beat(t,z,false,false);return y}if(id==='AV3'){let y=0;for(let z=-1;z<9;z+=.72)y+=gauss(t,z,.12,.025);for(let z=-1.1;z<9;z+=rr)y+=beat(t,z,true,false);return y}if(id==='AV2I'){let y=0,i=0;for(let z=-1;z<9;z+=rr){let drop=i++%4===3;y+=gauss(t,z-.22,.13,.026);if(!drop)y+=beat(t,z,false,false)}return y}if(id==='AV2II'){let y=0,i=0;for(let z=-1;z<9;z+=rr){let drop=i++%3===2;y+=gauss(t,z-.17,.13,.026);if(!drop)y+=beat(t,z,false,false)}return y}if(id==='VT'){let y=0;for(let z=-1;z<9;z+=rr)y+=beat(t,z,true,false);return y}let y=0,i=0;for(let z=-1;z<9;z+=rr){i++;if(id==='PAC'&&i===s.pacAt){y+=beat(t,z-.23,false,true,.11);continue}if(id==='PVC'&&i===s.pvcAt){y+=beat(t,z-.18,true,false);continue}y+=beat(t,z,false,true,id==='AV1'?.28:.16)}return y}function frame(){const w=W(),h=H();ctx.clearRect(0,0,w,h);ctx.beginPath();ctx.lineWidth=3;ctx.strokeStyle='#0b6477';ctx.shadowColor='#0b647755';ctx.shadowBlur=4;for(let x=0;x<=w;x+=2){let t=(x+offset)/110;let y=base()-val(t)*h*.32;if(x===0)ctx.moveT // Monitor sweep: trace advances left → right at a constant time-based speed.
// The timebase is cyclic, so the strip is always populated and never falls into a blank line after a few seconds.
function drawECG(id,s){
  const c=$('#ecg'),ctx=c.getContext('2d'),dpr=devicePixelRatio||1;
  c.width=c.clientWidth*dpr;c.height=c.clientHeight*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  let sweep=0,lastTime=null;
  const mod=(n,p)=>((n%p)+p)%p, gauss=(x,mu,a,w)=>a*Math.exp(-(((x-mu)/w)**2));
  function beat(t,center,wide=false,p=true,pr=.16){let y=0;if(p)y+=gauss(t,center-pr,.13,.026);return y+gauss(t,center-.025,-.16,.012)+gauss(t,center,.92,wide?.040:.016)+gauss(t,center+.035,-.27,.016)+gauss(t,center+.27,.25,.055)}
  function value(time){

    if(id==='VF')return .25*Math.sin(2*Math.PI*time*5+s.seed)+.16*Math.sin(2*Math.PI*time*8.2)+.12*Math.sin(2*Math.PI*time*13.7);
    if(id==='AF'){let y=.028*Math.sin(time*36)+.02*Math.sin(time*57);for(let z=-rr;z<rr*2;z+=rr*(.72+((Math.sin(z*8+s.seed)+1)/2)*.55))y+=beat(t,z,false,false);return y}
    if(id==='AFL'){let y=.07*Math.sin(2*Math.PI*time*5.1);for(let z=-rr;z<rr*2;z+=rr)y+=beat(t,z,false,false);return y}

 else if(id==='VT'){cycle=rr;add(rr*.40,{wide:true});}

 }
 ox.clearRect(0,0,ow,oh);ox.beginPath();ox.lineWidth=3;ox.strokeStyle='#0b6477';ox.lineJoin='round';ox.lineCap='round';

}
